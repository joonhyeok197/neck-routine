<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>등통증 코스 루틴</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --sub:#5d6678; --line:#e3e6ec;
  --accent:#2f6fed; --accent-soft:#e8f0ff; --ok:#1f9d63; --warn:#b4540a; --warn-soft:#fff2e4;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --card:#1b202b; --ink:#eef1f6; --sub:#9aa4b8; --line:#2a3140;
    --accent:#6b9bff; --accent-soft:#1f2a45; --ok:#4cc38a; --warn:#f0a35e; --warn-soft:#3a2a18;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 8px;cursor:pointer;font:inherit;text-align:center}
.tab b{display:block;font-size:14px}
.tab span{display:block;font-size:12px;color:var(--sub)}
.tab.on{border-color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.meta h2{font-size:17px;margin:0}
.meta p{margin:0;color:var(--sub);font-size:13px}
.prog{font-size:13px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.table{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 150px 130px 1fr 88px 124px;gap:12px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{background:var(--bg);font-size:12px;color:var(--sub);padding:8px 16px;align-items:center}
.row.done .name,.row.done .how{opacity:.45;text-decoration:line-through}
.chk{display:flex;align-items:center;gap:6px}
.chk input{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}
.chk em{font-style:normal;color:var(--sub);font-size:13px}
.name b{display:block;font-size:15px}
.name small{color:var(--sub)}
.tag{display:inline-block;margin-top:4px;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.how ol{margin:0;padding-left:18px}
.how li{margin:0 0 2px}
.how .cue{margin-top:6px;font-size:13px;color:var(--warn)}
.amt{font-weight:600}
.pic img{width:100%;height:96px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);display:block}
.links{display:flex;flex-direction:column;gap:6px}
.btn{display:block;text-align:center;text-decoration:none;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 8px}
.btn:hover{background:var(--accent-soft)}
.btn.alt{color:var(--sub);border-color:var(--line)}
.notice{margin-top:16px;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13px}
.notice b{color:var(--warn)}
.reset{margin-top:12px;background:none;border:0;color:var(--sub);cursor:pointer;font:inherit;text-decoration:underline}
body{padding-bottom:120px}
.tfab{position:fixed;right:16px;bottom:16px;z-index:20;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.25);padding:10px 16px}
.timer[hidden],.tfab[hidden]{display:none}
.t-in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:200px 1fr auto;gap:12px 16px;align-items:center}
.t-main{display:flex;align-items:baseline;gap:10px}
.t-main span{font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.t-main span.ready{background:var(--accent);color:#fff}
.t-set input[type=range]{width:80px;vertical-align:middle;accent-color:var(--accent)}
.t-main span.work{background:var(--ok);color:#fff}
.t-main span.rest{background:var(--warn);color:#fff}
.t-main b{font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.t-set{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub)}
.t-set input[type=number]{width:60px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.t-btn{display:flex;gap:6px}
.t-btn button{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.t-btn #tgo{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (max-width:760px){
  .t-in{grid-template-columns:1fr auto}
  .t-set{grid-column:1 / -1;order:3}
  .t-main b{font-size:28px}
  body{padding-bottom:170px}
}
@media (max-width:760px){
  .tabs{grid-template-columns:repeat(2,1fr)}
  .head{display:none}
  .row{grid-template-columns:44px 1fr;gap:8px 12px}
  .row .pic,.row .how,.row .amt,.row .links{grid-column:2}
  .pic img{height:180px}
  .links{flex-direction:row}
  .links .btn{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>등통증 코스 루틴</h1>
  <p class="lead">오늘 컨디션에 맞는 코스를 고르세요. 동작 옆 버튼을 누르면 구글 이미지·유튜브에서 자세를 바로 확인할 수 있습니다.</p>

  <div class="tabs" id="tabs"></div>

  <div class="meta">
    <div><h2 id="ctitle"></h2><p id="cdesc"></p></div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>

  <div class="table" id="table"></div>

  <div class="notice"><b>공통 원칙</b> 통증 없는 범위에서만 합니다. 찌릿함·저림·숨 쉴 때 찌름이 오면 그 동작은 바로 중단하세요. 목을 뒤로 젖히거나 등을 꺾는 동작은 하지 않습니다. 따뜻한 샤워 뒤에 시작하면 더 편합니다.</div>
  <button class="reset" id="reset">오늘 체크 초기화</button>
</div>

<button class="tfab" id="tfab">⏱ 타이머</button>
<div class="timer" id="timer" hidden>
  <div class="t-in">
    <div class="t-main"><span id="tphase">준비</span><b id="tleft">00:30</b></div>
    <div class="t-set">
      <label>운동 <input type="number" id="twork" min="1" max="3600" value="30">초</label>
      <label>쉬는시간 <input type="number" id="trest" min="1" max="3600" value="10">초</label>
      <label>세트 <input type="number" id="tsets" min="0" max="99" value="3">회 <small>(0=무한)</small></label>
      <label>준비 <input type="number" id="tready" min="0" max="600" value="5">초</label>
      <label><input type="checkbox" id="tsound" checked> 소리</label>
      <label>음량 <input type="range" id="tvol" min="0" max="100" value="40"></label>
      <label>음높이 <input type="range" id="tpitch" min="300" max="1600" step="10" value="880"></label>
    </div>
    <div class="t-btn">
      <button id="tgo">시작</button>
      <button id="treset">초기화</button>
      <button id="tclose">끄기</button>
    </div>
  </div>
</div>

<script>
const G = q => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(q);
const Y = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);

/* 동작 라이브러리: id, 한글명, 영문명, 단계, 횟수, 주의, 구글이미지 검색어, 유튜브 검색어, 태그 */
const EX = {
  chin:{n:"친턱",e:"Chin Tuck",s:["벽에 등을 대거나 의자에 바르게 앉기","턱을 뒤로 밀어 '이중턱'을 만들기","5초 유지 후 천천히 풀기"],a:"5초 × 10회",c:"고개를 숙이지 말고 수평으로 뒤로 당기기",g:"chin tuck exercise",y:"친턱 운동 방법 거북목",t:"목 정렬"},
  door:{n:"도어웨이 가슴 스트레칭",e:"Doorway Pec Stretch",s:["문틀에 팔꿈치 90도로 대기","한 발 앞으로 내딛으며 가슴을 앞으로 밀기","가슴 앞이 늘어나는 곳에서 유지"],a:"20~30초 × 2~3회",c:"허리가 꺾이지 않게 배에 힘 주기",g:"doorway pec stretch",y:"도어웨이 가슴 스트레칭",t:"가슴 열기"},
  thread:{n:"스레드 더 니들",e:"Thread the Needle",s:["네발 자세에서 한 팔을 들어 올리기","그 팔을 반대쪽 겨드랑이 밑으로 넣어 어깨를 바닥에 대기","천천히 돌아와 반대쪽도 반복"],a:"좌우 5~8회",c:"날개뼈 안쪽이 아프면 범위를 줄이기",g:"thread the needle yoga pose",y:"thread the needle stretch 흉추 회전",t:"흉추 회전"},
  utrap:{n:"상부 승모근 스트레칭",e:"Upper Trapezius Stretch",s:["의자에 앉아 반대 손은 의자나 엉덩이 밑에 두기","고개를 옆으로 기울이기","손으로 아주 가볍게만 보조"],a:"20~30초 × 양쪽 2회",c:"세게 당기지 않기, 어깨는 내린 상태 유지",g:"upper trapezius stretch",y:"상부 승모근 스트레칭 방법",t:"어깨 내리기"},
  lev:{n:"견갑거근 스트레칭",e:"Levator Scapulae Stretch",s:["앉아서 한쪽 팔을 등 뒤로 돌리기","코를 겨드랑이 방향으로 45도 숙이기","목 뒤 옆이 늘어나는 정도에서 유지"],a:"20~30초 × 양쪽 2회",c:"목에 힘주어 누르지 않기",g:"levator scapulae stretch",y:"견갑거근 스트레칭",t:"목-날개뼈"},
  scal:{n:"사각근 스트레칭",e:"Scalene Stretch",s:["한 손으로 쇄골 위를 가볍게 눌러 고정","고개를 반대쪽으로 아주 조금 기울이기","목 옆 앞쪽이 살짝 당기는 정도에서 유지"],a:"15~20초 × 양쪽 2회",c:"저림·찌릿하면 즉시 중단",g:"middle scalene stretch",y:"사각근 스트레칭",t:"의사 확인 후",w:1},
  cat:{n:"고양이-소 자세",e:"Cat-Cow",s:["네발 자세, 손은 어깨 아래·무릎은 골반 아래","숨 내쉬며 등을 둥글게 말기 (고양이)","숨 마시며 가볍게 가슴을 열기 (소, 작게)"],a:"8~10회",c:"소 자세는 크게 꺾지 않기",g:"cat cow stretch",y:"캣카우 고양이 자세 방법",t:"흉추 가동"},
  child:{n:"아기 자세",e:"Child's Pose",s:["무릎을 꿇고 엉덩이를 뒤꿈치 쪽으로 보내기","팔을 앞으로 길게 뻗고 이마를 바닥에 두기","등과 옆구리로 깊게 호흡"],a:"30~60초",c:"무릎이 불편하면 엉덩이 밑에 쿠션",g:"child's pose yoga",y:"아기 자세 차일드 포즈 방법",t:"이완"},
  sq:{n:"견갑골 모으기",e:"Scapular Retraction",s:["선 자세로 어깨를 귀에서 멀리 내리기","두 날개뼈를 아래·뒤로 살짝 모으기","5초 유지 후 풀기"],a:"5초 × 10회",c:"쥐어짜지 말고 부드럽게",g:"shoulder blade squeeze exercise",y:"견갑골 모으기 운동",t:"날개뼈 활성"},
  wslide:{n:"벽 슬라이드",e:"Wall Slide",s:["벽에 등·엉덩이·뒤통수를 대고 서기","팔꿈치와 팔뚝을 벽에 붙인 채 위로 미끄러뜨리기","천천히 내려오기"],a:"8~10회 × 2세트",c:"허리가 뜨지 않게, 팔은 아픈 범위 전까지만",g:"wall slide exercise shoulder",y:"월 슬라이드 어깨 운동",t:"전거근"},
  open:{n:"오픈북",e:"Thoracic Open Book",s:["옆으로 누워 무릎을 90도로 굽혀 포개기","두 손을 앞으로 모으기","윗팔을 천장→반대쪽으로 열며 가슴 돌리기"],a:"좌우 6회",c:"통증 없을 때만, 무릎은 떨어지지 않게",g:"thoracic open book stretch",y:"오픈북 스트레칭 흉추 회전",t:"흉추 회전"},
  cross:{n:"크로스 바디 숄더 스트레칭",e:"Cross-body Shoulder Stretch",s:["한 팔을 가슴 앞으로 가로지르기","반대 팔로 팔꿈치 아래를 가볍게 당기기","어깨 뒤가 늘어나는 곳에서 유지"],a:"20~30초 × 양쪽",c:"날개뼈 안쪽이 아프면 생략",g:"cross body shoulder stretch",y:"크로스 바디 어깨 스트레칭",t:"후면 어깨"},
  bird:{n:"버드독",e:"Bird Dog",s:["네발 자세에서 배에 힘 주기","오른팔과 왼다리를 동시에 수평으로 뻗기","2초 유지 후 반대쪽"],a:"좌우 8회 × 2세트",c:"골반이 한쪽으로 기울지 않게",g:"bird dog exercise",y:"버드독 운동 방법",t:"코어"},
  dead:{n:"데드버그",e:"Dead Bug",s:["누워서 팔은 천장 방향, 무릎은 90도로 들기","허리를 바닥에 붙인 채 반대 팔·다리를 천천히 내리기","원위치 후 반대쪽"],a:"좌우 8회 × 2세트",c:"허리가 뜨면 범위를 줄이기",g:"dead bug exercise",y:"데드버그 운동 방법",t:"코어"},
  bridge:{n:"글루트 브릿지",e:"Glute Bridge",s:["누워서 무릎을 세우고 발을 골반너비로 두기","엉덩이로 골반을 들어 어깨-골반-무릎을 일직선으로","2초 유지 후 천천히 내리기"],a:"12회 × 2세트",c:"허리가 아니라 엉덩이로 올리기",g:"glute bridge exercise",y:"글루트 브릿지 방법",t:"엉덩이"},

  chest:{n:"의자 가슴 열기",e:"Seated Chest Opener",s:["의자 앞쪽에 앉아 등 뒤에서 두 손 깍지 끼기","어깨를 내리며 손을 아래로 살짝 밀어내기","가슴 앞이 열리는 곳에서 유지"],a:"20초 × 2회",c:"고개는 젖히지 말고 정면 유지",g:"seated chest stretch hands clasped behind back",y:"의자 가슴 스트레칭 사무실",t:"사무실"},
  twist:{n:"앉아서 흉추 회전",e:"Seated Thoracic Rotation",s:["양팔을 가슴 앞에 교차하고 의자에 앉기","골반은 고정한 채 상체만 한쪽으로 돌리기","2~3초 유지 후 반대쪽"],a:"좌우 6회",c:"우두둑 소리 내려고 세게 비틀지 않기",g:"seated thoracic rotation exercise chair",y:"앉아서 흉추 회전 사무실",t:"사무실"},
  stand:{n:"일어나 걷기",e:"Stand-up Walk Break",s:["1시간마다 자리에서 일어나기","가슴을 펴고 1~2분 걷기","물 마시거나 화장실 다녀오기"],a:"1~2분",c:"한 자세로 오래 앉아 있지 않기",g:"office walking break stand up from desk",y:"사무실 1시간마다 일어나 걷기 스트레칭",t:"사무실"},
  walk:{n:"파워워킹",e:"Brisk Walking",s:["가슴을 펴고 시선은 정면, 턱 살짝 당기기","팔은 90도로 자연스럽게 흔들기","3분 빠르게 + 2분 보통 속도 반복"],a:"20~30분",c:"숨 쉴 때 통증이 있으면 속도 낮추기",g:"power walking posture",y:"파워워킹 올바른 자세",t:"유산소"}
};

const COURSES = [
  {id:"c1",name:"코스 1 · 풀어주기",time:"약 15분",desc:"뻐근한 날. 스트레칭 위주로 가슴·목·날개뼈를 부드럽게 풀어줍니다.",
   list:["chin","door","thread","utrap","lev","cat","child","sq"]},
  {id:"c2",name:"코스 2 · 날개뼈 깨우기",time:"약 20분",desc:"컨디션 보통인 날. 흉추를 돌리고 날개뼈 주변을 가볍게 활성화합니다.",
   list:["chin","cat","open","door","wslide","sq","cross","bird","scal"]},
  {id:"c3",name:"코스 3 · 코어·엉덩이",time:"약 30분",desc:"컨디션 좋은 날. 자세를 받쳐주는 코어와 엉덩이를 쓰고 걷기로 마무리합니다.",
   list:["chin","child","dead","bird","bridge","fig4","wslide","band","walk"]},
  {id:"c4",name:"코스 4 · 사무실 틈틈이",time:"약 5분",desc:"근무 중 1~2시간마다 자리에서 하는 짧은 루틴입니다. 매트 없이 의자만 있으면 됩니다.",
   list:["chin","roll","seatsq","chest","twist","utrap","lev","stand"]}
];

const KEY="backcourse_v1";
const today=new Date().toISOString().slice(0,10);
let state={day:today,course:"c1",done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.day===today) state=s; else if(s) state.course=s.course||"c1";}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const tabs=document.getElementById("tabs"), table=document.getElementById("table");

function pickRandom(){
  const others=COURSES.filter(c=>c.id!==state.course&&c.id!=="c4");
  return others[Math.floor(Math.random()*others.length)].id;
}
function renderTabs(){
  tabs.innerHTML="";
  COURSES.forEach(c=>{
    const b=document.createElement("button");
    b.className="tab"+(state.course===c.id?" on":"");
    b.innerHTML="<b>"+c.name.split(" · ")[0]+"</b><span>"+c.name.split(" · ")[1]+" · "+c.time+"</span>";
    b.onclick=()=>{state.course=c.id;save();render();};
    tabs.appendChild(b);
  });
  const r=document.createElement("button");
  r.className="tab"; r.innerHTML="<b>🎲 랜덤</b><span>오늘은 뭘 할까?</span>";
  r.onclick=()=>{state.course=pickRandom();save();render();};
  tabs.appendChild(r);
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
  renderTabs();
  const c=COURSES.find(x=>x.id===state.course);
  document.getElementById("ctitle").textContent=c.name+" ("+c.time+")";
  document.getElementById("cdesc").textContent=c.desc;
  let html='<div class="row head"><div>완료</div><div>동작</div><div>사진</div><div>방법</div><div>횟수</div><div>자세 확인</div></div>';
  c.list.forEach((id,i)=>{
    const x=EX[id], k=c.id+":"+id, d=!!state.done[k];
    html+='<div class="row'+(d?" done":"")+'">'+
      '<label class="chk"><input type="checkbox" data-k="'+k+'"'+(d?" checked":"")+' aria-label="'+esc(x.n)+' 완료"><em>'+(i+1)+'</em></label>'+
      '<div class="name"><b>'+esc(x.n)+'</b><small>'+esc(x.e)+'</small><br><span class="tag'+(x.w?" warn":"")+'">'+esc(x.t)+'</span></div>'+
      '<a class="pic" target="_blank" rel="noopener" href="'+G(x.g)+'" title="구글 이미지에서 더 보기"><img src="images/'+id+'.jpg" alt="'+esc(x.n)+'" loading="lazy"></a>'+
      '<div class="how"><ol>'+x.s.map(t=>"<li>"+esc(t)+"</li>").join("")+'</ol><div class="cue">⚠ '+esc(x.c)+'</div></div>'+
      '<div class="amt">'+esc(x.a)+'</div>'+
      '<div class="links"><a class="btn" target="_blank" rel="noopener" href="'+G(x.g)+'">구글 이미지</a><a class="btn alt" target="_blank" rel="noopener" href="'+Y(x.y)+'">유튜브 영상</a></div>'+
    '</div>';
  });
  table.innerHTML=html;
  table.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{
    state.done[cb.dataset.k]=cb.checked; save(); render();
  });
  const total=c.list.length, n=c.list.filter(id=>state.done[c.id+":"+id]).length;
  document.getElementById("prog").textContent=n+" / "+total+" 완료";
  document.getElementById("barfill").style.width=(n/total*100)+"%";
}
document.getElementById("reset").onclick=()=>{state.done={};save();render();};
render();

/* 타이머: 운동 → 쉬는시간 → 운동 … 반복. 시작 시 길게 "삐", 쉬는시간 시작 시 짧게 "삐삐" */
(function(){
  const $=id=>document.getElementById(id), TK="backtimer_v1";
  const box=$("timer"), fab=$("tfab"), phaseEl=$("tphase"), leftEl=$("tleft"), goBtn=$("tgo");
  const work=$("twork"), rest=$("trest"), sets=$("tsets"), snd=$("tsound"), ready=$("tready"), vol=$("tvol"), pitch=$("tpitch");
  try{const s=JSON.parse(localStorage.getItem(TK)||"null"); if(s){work.value=s.w;rest.value=s.r;sets.value=s.n??3;snd.checked=s.s;ready.value=s.d??5;vol.value=s.v??40;pitch.value=s.p??880;}}catch(e){}
  const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify({w:work.value,r:rest.value,n:sets.value,s:snd.checked,d:ready.value,v:vol.value,p:pitch.value}))}catch(e){}};
  const secs=el=>Math.min(3600,Math.max(1,parseInt(el.value)||1));
  const rdy=()=>{const v=parseInt(ready.value);return isNaN(v)?0:Math.min(600,Math.max(0,v));};
  const nset=()=>{const v=parseInt(sets.value);return isNaN(v)?3:Math.min(99,Math.max(0,v));};
  let cur=1;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  let ac=null, ph="idle", endAt=0, remain=0, running=false, timer=null;

  function beep(freq,dur,delay){
    if(!snd.checked||!ac)return;
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type="sine"; o.frequency.value=freq;
    const v=Math.max(0.0002,vol.value/100);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function show(){
    const n=nset(), name={idle:"대기",ready:"준비",work:"운동",rest:"휴식",done:"완료"}[ph];
    phaseEl.textContent=(ph==="work"||ph==="rest")?name+" "+cur+(n?"/"+n:""):(ph==="idle"?name+" "+(n?n+"세트":"무한"):name); phaseEl.className=ph;
    const s=running?Math.max(0,Math.ceil((endAt-Date.now())/1000)):Math.ceil(remain/1000);
    leftEl.textContent=ph==="idle"?fmt(rdy()||secs(work)):(ph==="done"?"00:00":fmt(s));
    goBtn.textContent=running?"일시정지":(ph==="idle"?"시작":(ph==="done"?"다시 시작":"계속"));
  }
  function begin(p){
    const P=+pitch.value;
    ph=p; remain=(p==="ready"?rdy():secs(p==="work"?work:rest))*1000; endAt=Date.now()+remain;
    if(p==="work") beep(P,0.5); else if(p==="rest"){beep(P*0.6,0.18);beep(P*0.6,0.18,0.28);}
  }
  function tick(){
    if(Date.now()>=endAt){
      if(ph==="ready") begin("work");
      else if(ph==="work"){
        const P=+pitch.value;
        if(nset()>0&&cur>=nset()){stop();ph="done";remain=0;beep(P,0.2);beep(P,0.2,0.3);beep(P*1.33,0.5,0.6);}
        else begin("rest");
      }else{cur++;begin("work");}
    }
    show();
  }
  function stop(){clearInterval(timer);timer=null;running=false;}
  goBtn.onclick=()=>{
    if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(ac&&ac.state==="suspended")ac.resume();
    if(running){remain=Math.max(0,endAt-Date.now());stop();}
    else{
      if(ph==="done")ph="idle";
      if(ph==="idle"){cur=1;begin(rdy()>0?"ready":"work");} else endAt=Date.now()+remain;
      running=true; timer=setInterval(tick,200);
    }
    show();
  };
  $("treset").onclick=()=>{stop();ph="idle";show();};
  $("tclose").onclick=()=>{stop();ph="idle";box.hidden=true;fab.hidden=false;};
  fab.onclick=()=>{box.hidden=false;fab.hidden=true;show();};
  [work,rest,sets,snd,ready,vol,pitch].forEach(el=>el.onchange=()=>{saveT();if(ph==="idle")show();});
  // 음량·음높이를 바꾸면 바로 들어볼 수 있게 시험음 재생
  [vol,pitch].forEach(el=>el.addEventListener("change",()=>{
    if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(ac&&ac.state==="suspended")ac.resume();
    beep(+pitch.value,0.3);
  }));
  show();
})();
</script>
